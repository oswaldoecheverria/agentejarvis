<!doctype html>
<html lang="es">
  <head>
    <script>
      function showError(msg, loc) {
        if (!document.body) return;
        var errDiv = document.getElementById('global-error-overlay');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'global-error-overlay';
          errDiv.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#ef4444;color:#fff;padding:16px;border-radius:12px;font-family:monospace;font-size:12px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.3);';
          document.body.appendChild(errDiv);
        }
        errDiv.innerHTML = '<strong>Error de ejecución detectado:</strong><br/>' + msg + (loc ? '<br/><span style="opacity:0.8;font-size:10px;">' + loc + '</span>' : '');
      }
      window.addEventListener('error', function(event) {
        showError(event.message, (event.filename || '') + ':' + (event.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function(event) {
        showError(event.reason?.message || String(event.reason), 'Promise rejection');
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Vault — Bóveda Privada de Componentes</title>

  </head>
  <body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-emerald-500/20 selection:text-emerald-900">

</html>
